server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000;
        client_max_body_size 60m;
    }
    location = /health {
        rewrite ^ /api/v1/health break;
        proxy_pass http://api:8000;
    }
    location / {
        try_files $uri /index.html;
    }
}
